<head>

<title>Ponyscapes Map Preview</title>
<style>
  :root { --bg: #14181f; --panel: #1d2430; --ink: #e8edf4; --dim: #9aa7b8; --line: #34415a; --accent: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; } p.sub { margin: 0 0 12px; color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  button { background: var(--accent); color: #1a1405; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  button.alt { background: #2b3750; color: var(--ink); font-weight: 500; }
  input[type=number] { width: 120px; background: #10141b; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 12px; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: auto; background: #0e3a5c; border: 1px solid var(--line); border-radius: 8px; image-rendering: pixelated; display: block; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .side h2 { font-size: 13px; margin: 0 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .key { display: flex; align-items: center; gap: 8px; margin: 3px 0; } .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; flex: none; }
  #info { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; margin-top: 8px; }
</style>

<body>
<main>
  <h1>Map preview</h1>
  <p class="sub">Generates the zone map from a seed with the game's own code. Nothing here touches your saved worlds.</p>
  <div class="bar">
    <button id="regen">Regenerate</button>
    <button id="back" class="alt">&larr; Previous</button>
    <label>Seed <input id="seed" type="number" step="1"></label>
    <button id="go" class="alt">Go</button>
    <label><input id="auto" type="checkbox"> Auto-regenerate every <input id="secs" type="number" min="1" max="60" value="4" style="width:60px"> s</label>
    <label><input id="gates" type="checkbox"> Open all gateways</label>
  </div>
  <div class="wrap">
    <canvas id="map" width="900" height="900"></canvas>
    <div class="side">
      <h2>Key</h2><div id="key"></div>
      <h2 style="margin-top:12px">This map</h2><div id="info"></div>
    </div>
  </div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id), canvas = $('map'), ctx = canvas.getContext('2d');
const STEP = 3, hist = [], off = document.createElement('canvas'), octx = off.getContext('2d'); let job = 0, timer = null, current = null;
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const COLORS = { water: [20, 74, 118], shallow: [58, 128, 168], sand: [226, 208, 150], stone: [128, 124, 116], wall: [58, 54, 60], far: [14, 58, 92], gateOpen: [90, 220, 120], gateShut: [170, 90, 230], dirt: [150, 120, 84] };

function draw(seed) {
  const id = ++job, T = new TerrainGenerator(seed), Z = T.layers.zones, o = CONFIG.sim.levels.origin;
  if ($('gates').checked) for (const z of Zones.all()) Z.unlock(z.index);
  const R = Math.ceil(Z.edge) + 6, N = Math.ceil(2 * R / STEP), img = ctx.createImageData(N, N), px = img.data;
  off.width = off.height = N; const S = Math.max(1, Math.floor(900 / N)); canvas.width = canvas.height = N * S;
  const mapColor = {}; for (const b of Biomes.all()) mapColor[b.id] = rgb(b.mapColor);
  let row = 0;
  const slice = () => {
    if (id !== job) return;                                           // (a newer map was asked for)
    const end = Math.min(N, row + 12);
    for (; row < end; row++) for (let col = 0; col < N; col++) {
      const tx = Math.floor(o.x - R + col * STEP), ty = Math.floor(o.y - R + row * STEP), k = Z.kindAt(tx, ty);
      let c;
      if (k === ZONE_KIND.FAR) c = COLORS.far;
      else if (k === ZONE_KIND.GATE) c = Z.gateAt(tx, ty) >= 0 ? COLORS.gateShut : COLORS.gateOpen;
      else if (k === ZONE_KIND.WALL) c = COLORS.wall;
      else {
        const t = T.tile(tx, ty);
        c = t === TILE.WATER ? COLORS.water : t === TILE.SHALLOW ? COLORS.shallow : t === TILE.SAND ? COLORS.sand : t === TILE.STONE ? COLORS.stone : mapColor[T.biomeAt(tx, ty, t)] || [90, 160, 90];
      }
      const i = (row * N + col) * 4; px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
    }
    octx.putImageData(img, 0, 0); ctx.imageSmoothingEnabled = false; ctx.drawImage(off, 0, 0, N * S, N * S);
    if (row < N) { requestAnimationFrame(slice); return; }
    marks(T, Z, R, o, S);
  };
  describe(T, Z, seed);
  slice();
}
function marks(T, Z, R, o, S) {                                              // the village, the cave mouth, the zone names
  const at = (x, y) => [(x - (o.x - R)) / STEP * S, (y - (o.y - R)) / STEP * S];
  const dot = (x, y, fill) => { const [px, py] = at(x, y); ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#000'; ctx.stroke(); };
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  for (const n of Z.layout()) { const [px, py] = at(n.x, n.y + (n.def.index ? 0 : 55)); ctx.fillStyle = '#000a'; ctx.fillText(n.def.name, px + 1, py + 1); ctx.fillStyle = '#fff'; ctx.fillText(n.def.name, px, py); }
  dot(o.x, o.y, '#ffe9a8');
  for (const c of T.caveSites.caves()) dot(c.x, c.y, '#ff6a3d');
}
function describe(T, Z, seed) {
  const lines = ['Seed ' + seed, ''];
  const names = list => (list || []).map(([id]) => (TreeSpecies.get(id) || ItemDB.get(id) || { name: id }).name).join(', ');
  for (const n of Z.layout()) { const f = Flora.get(n.def.biome); lines.push(`${n.def.name}\n  biome ${n.def.biome}, radius ${Math.round(n.r)}${n.parent ? ', off ' + n.parent.def.name + ' at ' + Math.round(n.angle * 180 / Math.PI) + ' deg' : ' (the village)'}${n.def.locked ? ', gate shut' : ''}${f ? '\n  trees: ' + names(f.trees) + '\n  bushes: ' + names(f.bushes) + (f.mushrooms ? '\n  mushrooms: ' + names(f.mushrooms) : '') : ''}`); }
  const caves = T.caveSites.caves(); lines.push('', 'Cave mouth: ' + (caves.length ? Math.round(caves[0].x - CONFIG.sim.levels.origin.x) + ', ' + Math.round(caves[0].y - CONFIG.sim.levels.origin.y) + ' from the village' : 'none'));
  $('info').textContent = lines.join('\n');
}
function show(seed, remember = true) {
  if (remember && current !== null) hist.push(current);
  current = seed | 0; $('seed').value = current; draw(current);
}
const randomSeed = () => (Math.random() * 2147483647) | 0;
$('regen').onclick = () => show(randomSeed());
$('back').onclick = () => { if (hist.length) show(hist.pop(), false); };
$('go').onclick = () => show(+$('seed').value || 0);
$('gates').onchange = () => draw(current);
const tick = () => { clearInterval(timer); timer = $('auto').checked ? setInterval(() => show(randomSeed()), Math.max(1, +$('secs').value || 4) * 1000) : null; };
$('auto').onchange = tick; $('secs').onchange = tick;
const key = $('key');
for (const [n, c] of [['Sea / deep water', COLORS.water], ['Shallows', COLORS.shallow], ['Beach', COLORS.sand], ['Rock', COLORS.stone], ['Cliff wall', COLORS.wall], ['Open gateway', COLORS.gateOpen], ['Shut gateway', COLORS.gateShut], ['Beyond the map (invisible barrier)', COLORS.far]]) key.insertAdjacentHTML('beforeend', `<div class="key"><span class="sw" style="background:rgb(${c})"></span>${n}</div>`);
for (const z of Zones.all()) { const b = Biomes.get(z.biome); key.insertAdjacentHTML('beforeend', `<div class="key"><span class="sw" style="background:${b.mapColor}"></span>${z.name} (${b.name})</div>`); }
key.insertAdjacentHTML('beforeend', '<div class="key"><span class="sw" style="background:#ffe9a8"></span>Village</div><div class="key"><span class="sw" style="background:#ff6a3d"></span>Cave mouth</div>');
const fromUrl = new URLSearchParams(location.search).get('seed');
show(fromUrl !== null && fromUrl !== '' ? +fromUrl : randomSeed(), false);
</script>
