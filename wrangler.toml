# Cloudflare PAGES: the game. Deploy with `npm run deploy:pages`, or connect the Git repository in the Cloudflare dashboard
# (Workers & Pages > Create > Pages > Connect to Git) with build command: (none)  and  build output directory: public
#
# Multiplayer: functions/ws.js hands each WebSocket to the relay's Durable Object, which lives in the relay Worker (relay/wrangler.toml).
# Deploy that Worker FIRST (npm run deploy:relay); without it the game still runs solo and offline, and "Host a game" reports that it cannot reach the relay.
name = "realm"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RealmRoom"
script_name = "realm-relay"        # the relay Worker's name in relay/wrangler.toml
